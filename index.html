<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWeather - Weather App</title>
  <meta name="description" content="Weather application providing current weather conditions, 5-day forecast, temperature, humidity, wind speed, pressure, visibility, and feels-like temperature by city search or geolocation.">
  <meta property="og:title" content="OWeather - Weather App">
  <meta property="og:description" content="Weather application providing current weather conditions, 5-day forecast, temperature, humidity, wind speed, pressure, visibility, and feels-like temperature by city search or geolocation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-cloud-sun-rain logo-icon" aria-hidden="true"></i>
        <h1>OWeather</h1>
      </div>
      
      <!-- Temperature Unit Selector -->
      <div class="unit-toggle" role="group" aria-label="Temperature unit selection">
        <button type="button" id="celsiusBtn" class="unit-btn active" title="Metric (°C)">°C</button>
        <button type="button" id="fahrenheitBtn" class="unit-btn" title="Imperial (°F)">°F</button>
      </div>
    </header>

    <!-- Search Controls -->
    <div class="search-container">
      <form id="searchForm" class="search-form">
        <div class="input-wrapper">
          <i class="fa-solid fa-magnifying-glass input-icon" aria-hidden="true"></i>
          <input
            type="text"
            id="cityInput"
            placeholder="Search city (e.g. London, Tokyo, New York)..."
            autocomplete="off"
            aria-label="City name"
          >
          <button type="button" id="clearInputBtn" class="clear-btn hidden" style="display: none;" aria-label="Clear search input" hidden>
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <button type="submit" id="searchBtn" class="primary-btn">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <span>Search</span>
        </button>
        <button type="button" id="locationButton" class="icon-btn" title="Use my current location" aria-label="Use current location">
          <i class="fa-solid fa-location-crosshairs" aria-hidden="true"></i>
        </button>
      </form>

      <!-- Quick City Suggestions -->
      <div class="quick-cities" aria-label="Popular cities">
        <span class="quick-cities-label"><i class="fa-solid fa-compass" aria-hidden="true"></i> Popular:</span>
        <div class="quick-cities-buttons" id="quickCities">
          <button type="button" class="quick-city-btn" data-city="London">London</button>
          <button type="button" class="quick-city-btn" data-city="New York">New York</button>
          <button type="button" class="quick-city-btn" data-city="Tokyo">Tokyo</button>
          <button type="button" class="quick-city-btn" data-city="Paris">Paris</button>
          <button type="button" class="quick-city-btn" data-city="Lagos">Lagos</button>
          <button type="button" class="quick-city-btn" data-city="Sydney">Sydney</button>
        </div>
      </div>
    </div>

    <!-- Loading Feedback -->
    <div id="loadingMessage" class="loading-message hidden" style="display: none;" hidden>
      <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
      <span id="loadingText">Fetching weather data...</span>
    </div>

    <!-- Error Banner -->
    <div id="errorMessage" class="error-message hidden" style="display: none;" hidden role="alert">
      <div class="error-content">
        <i class="fa-solid fa-triangle-exclamation error-icon" aria-hidden="true"></i>
        <span id="errorText"></span>
      </div>
      <button type="button" id="dismissErrorBtn" class="error-close" aria-label="Dismiss error">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <!-- Current Weather Result Card -->
    <section id="weatherCard" class="weather-card hidden" style="display: none;" hidden>
      <div class="weather-card__header">
        <div class="location-meta">
          <h2 id="cityName">
            <i class="fa-solid fa-location-dot city-pin" aria-hidden="true"></i>
            <span id="cityNameText"></span>
          </h2>
          <p id="dateText" class="date-text">
            <i class="fa-regular fa-clock" aria-hidden="true"></i>
            <span id="dateTimeText"></span>
          </p>
        </div>
        <div class="condition-badge" id="conditionBadge">
          <span id="conditionTag"></span>
        </div>
      </div>

      <div class="weather-card__hero">
        <div class="weather-visual">
          <i id="weatherFaIcon" class="fa-solid fa-cloud-sun weather-fa-icon" aria-hidden="true"></i>
          <img id="weatherIcon" class="weather-icon-img" alt="Weather icon" />
        </div>
        <div class="weather-summary">
          <div class="temperature-wrap">
            <span id="temperature" class="temperature">--</span>
            <span id="unitDisplay" class="unit-symbol">°C</span>
          </div>
          <p id="description" class="description"></p>
          <div class="min-max-wrap">
            <span><i class="fa-solid fa-arrow-down" aria-hidden="true"></i> <span id="tempMin">--</span></span>
            <span class="divider">/</span>
            <span><i class="fa-solid fa-arrow-up" aria-hidden="true"></i> <span id="tempMax">--</span></span>
          </div>
        </div>
      </div>

      <!-- Extended Details Grid -->
      <div class="weather-card__details">
        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-temperature-half detail-icon" aria-hidden="true"></i>
            <span class="detail__label">Feels Like</span>
          </div>
          <span id="feelsLike" class="detail__value">--</span>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-droplet detail-icon" aria-hidden="true"></i>
            <span class="detail__label">Humidity</span>
          </div>
          <span id="humidity" class="detail__value">--</span>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-wind detail-icon" aria-hidden="true"></i>
            <span class="detail__label">Wind</span>
          </div>
          <div class="wind-metric">
            <span id="wind" class="detail__value">--</span>
            <i id="windDirectionIcon" class="fa-solid fa-location-arrow wind-arrow" title="Wind direction" aria-hidden="true"></i>
          </div>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-gauge-high detail-icon" aria-hidden="true"></i>
            <span class="detail__label">Pressure</span>
          </div>
          <span id="pressure" class="detail__value">--</span>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-eye detail-icon" aria-hidden="true"></i>
            <span class="detail__label">Visibility</span>
          </div>
          <span id="visibility" class="detail__value">--</span>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-cloud detail-icon" aria-hidden="true"></i>
            <span class="detail__label">Cloudiness</span>
          </div>
          <span id="cloudiness" class="detail__value">--</span>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-sun detail-icon sunrise-icon" aria-hidden="true"></i>
            <span class="detail__label">Sunrise</span>
          </div>
          <span id="sunrise" class="detail__value">--</span>
        </div>

        <div class="detail-card">
          <div class="detail-header">
            <i class="fa-solid fa-moon detail-icon sunset-icon" aria-hidden="true"></i>
            <span class="detail__label">Sunset</span>
          </div>
          <span id="sunset" class="detail__value">--</span>
        </div>
      </div>
    </section>

    <!-- 5-Day Forecast Section -->
    <section id="forecastSection" class="forecast-section hidden" style="display: none;" hidden>
      <div class="forecast-header">
        <h3><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> 5-Day Forecast</h3>
        <span class="forecast-subtitle">3-hour interval snapshots</span>
      </div>
      <div id="forecastContainer" class="forecast-grid"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
